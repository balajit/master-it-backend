[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-platform"
version = "0.1.0"
description = "Document processing and adaptive learning platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "networkx>=3.4",
    "docling>=2.114.0",
    "langchain-ollama>=1.1.0",
    "python-multipart>=0.0.32",
    "PyJWT>=2.9.0",
    "httpx>=0.28.0",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.1",
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["UP047", "UP017", "B008", "E741", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: in-process integration tests (no live server required)",
    "server: requires a live PostgreSQL instance on port 5433",
    "slow: tests that run the full pipeline and are intentionally slow",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learning_platform"]

[project.entry-points."learning_platform.plugins"]
