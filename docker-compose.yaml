services:
  postgres_prod:  # Unique YAML key
    image: postgres:16-alpine
    container_name: learning_platform_db_production
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: learning_platform
    ports:
      - "5432:5432"  # Maps local 5432 to this container
    volumes:
      - pgdata_prod:/var/lib/postgresql/data  # Unique volume
    restart: unless-stopped

  postgres_test:  # Unique YAML key
    image: postgres:16-alpine
    container_name: learning_platform_db_testing
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: learning_platform
    ports:
      - "5433:5432"  # Maps local 5433 to this container (No conflict!)
    volumes:
      - pgdata_test:/var/lib/postgresql/data  # Unique volume
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: learning_platform_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: secure_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  url-pdf-service:
    build:
      context: ./url-pdf-service
      dockerfile: Dockerfile
    image: master-it/url-pdf-service:latest
    container_name: url_pdf_service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata_prod:
  pgdata_test:
  minio_data:
